<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainpage</title>
<style>
:root { color-scheme: light dark; --bg: light-dark(#f6f6f4,#171816); --panel: light-dark(#ffffff,#20211f); --paper: light-dark(#ffffff,#1d1e1c); --text: light-dark(#252621,#e8e9e3); --muted: light-dark(#77796f,#a2a49a); --line: light-dark(#e4e5df,#373933); --accent: light-dark(#53684d,#b6c9a9); --accent-soft: light-dark(#edf2e9,#2c3729); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
#app { min-height: 100vh; width: 100%; background: var(--bg); }
.topbar { height: 58px; display:flex; align-items:center; gap:14px; padding:0 22px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
.brand { font-weight:700; letter-spacing:-.04em; font-size:18px; white-space:nowrap; } .brand span { color:var(--accent); }
.doc-title { border:1px solid transparent; border-radius:6px; padding:6px 8px; width:min(340px,36vw); background:transparent; color:var(--text); font:inherit; font-size:13px; }
.doc-title:hover,.doc-title:focus { border-color:var(--line); outline:none; }
.spacer { flex:1; }
.save-status { color:var(--muted); font-size:12px; white-space:nowrap; }
.btn { border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--text); padding:7px 11px; font:inherit; cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--accent-soft); } .btn.primary { background:var(--accent); border-color:var(--accent); color:light-dark(#fff,#1d2619); font-weight:600; }
.layout { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:calc(100vh - 58px); }
.sidebar { border-right:1px solid var(--line); padding:23px 15px; background:var(--bg); }
.side-head { display:flex; align-items:center; justify-content:space-between; margin:0 7px 14px; text-transform:uppercase; font-size:10px; font-weight:750; letter-spacing:.11em; color:var(--muted); }
.index-list { display:flex; flex-direction:column; gap:3px; }
.index-item { display:block; width:100%; text-align:left; padding:9px 10px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:inherit; font-size:13px; }
.index-item:hover { background:var(--panel); color:var(--text); } .index-item.active { background:var(--accent-soft); color:var(--text); font-weight:600; }
.index-empty { color:var(--muted); padding:8px; font-size:12px; line-height:1.6; }
.side-note { position:sticky; top:90vh; margin:34px 7px 0; color:var(--muted); font-size:11px; line-height:1.6; }
.main { padding:38px 28px 90px; min-width:0; }
.toolbar { display:flex; align-items:center; gap:6px; max-width:800px; margin:0 auto 18px; padding:7px; border:1px solid var(--line); background:var(--panel); border-radius:9px; position:sticky; top:72px; z-index:3; }
.tool-btn { min-width:34px; height:32px; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--text); cursor:pointer; font:inherit; }
.tool-btn:hover,.tool-btn.on { background:var(--accent-soft); border-color:var(--line); }
.tool-sep { width:1px; height:20px; background:var(--line); margin:0 3px; }
.toolbar-hint { color:var(--muted); font-size:11px; margin-left:auto; padding-right:6px; }
.paper { max-width:800px; min-height:calc(100vh - 205px); margin:0 auto; padding:55px clamp(24px,6vw,78px) 100px; background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 3px 18px #00000008; }
#editor { min-height:500px; outline:none; font-family:ui-serif,Georgia,"Times New Roman",serif; font-size:17px; line-height:1.85; overflow-wrap:anywhere; }
#editor:empty:before { content:attr(data-placeholder); color:var(--muted); pointer-events:none; }
#editor p { margin:0 0 1em; } #editor h2 { font-family:system-ui,sans-serif; font-size:1.35em; line-height:1.35; letter-spacing:-.025em; margin:1.7em 0 .65em; scroll-margin-top:130px; } #editor h3 { font-family:system-ui,sans-serif; font-size:1.12em; line-height:1.4; margin:1.4em 0 .5em; scroll-margin-top:130px; }
#editor h2:first-child,#editor h3:first-child { margin-top:0; }
.footer { max-width:800px; margin:12px auto 0; display:flex; justify-content:space-between; color:var(--muted); font-size:11px; padding:0 3px; }
.hidden { display:none !important; }
@media (max-width:720px) { .topbar { padding:0 12px; gap:7px; } .brand { font-size:16px; } .doc-title { width:30vw; } .save-status { display:none; } .layout { grid-template-columns:1fr; } .sidebar { border-right:0; border-bottom:1px solid var(--line); padding:10px 12px; } .side-head { margin-bottom:6px; } .index-list { flex-direction:row; overflow-x:auto; } .index-item { width:auto; max-width:180px; flex-shrink:0; } .index-empty,.side-note { display:none; } .main { padding:18px 10px 50px; } .toolbar { top:65px; margin-bottom:12px; } .toolbar-hint { display:none; } .paper { padding:32px 22px 65px; } #editor { font-size:16px; } .topbar .btn { padding:7px 8px; font-size:12px; } }
</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">plain<span>page</span></div>
  <input id="docTitle" class="doc-title" value="Untitled document" aria-label="Document title" spellcheck="false">
  <div class="spacer"></div>
  <span id="saveStatus" class="save-status">Saved locally</span>
  <button id="downloadBtn" class="btn">Export .txt</button>
  <button id="saveBtn" class="btn primary">Save file</button>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head"><span>Document index</span><button id="addHeading" class="btn" style="padding:3px 7px;font-size:12px">+ Subtitle</button></div>
    <nav id="indexList" class="index-list"><div class="index-empty">Add subtitles to create quick-jump links.</div></nav>
    <div class="side-note">Your draft autosaves in this browser. Export a file for a separate backup.</div>
  </aside>
  <main class="main">
    <div class="toolbar" role="toolbar" aria-label="Text tools">
      <button class="tool-btn" id="boldBtn" title="Bold (⌘/Ctrl+B)" aria-label="Bold"><strong>B</strong></button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="subtitleBtn" title="Make selected line a subtitle" aria-label="Subtitle">H2</button>
      <button class="tool-btn" id="bodyBtn" title="Normal text" aria-label="Normal text">¶</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="undoBtn" title="Undo" aria-label="Undo">↶</button>
      <button class="tool-btn" id="redoBtn" title="Redo" aria-label="Redo">↷</button>
      <span class="toolbar-hint">Plain text, with optional bold and subtitles</span>
    </div>
    <section class="paper"><div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing…&#10;&#10;Use + Subtitle to create sections you can jump to from the index."><p><br></p></div></section>
    <div class="footer"><span id="wordCount">0 words</span><span>Plainpage · lightweight notes</span></div>
  </main>
</div>
<input id="fileInput" class="hidden" type="file" accept=".html,.txt,.json,text/plain,text/html,application/json">
</div>
<script>
(() => {
  const STORAGE_KEY = 'plainpage-document-v1';
  const editor = document.getElementById('editor');
  const titleInput = document.getElementById('docTitle');
  const status = document.getElementById('saveStatus');
  const indexList = document.getElementById('indexList');
  let saveTimer;
  let undoStack = [];
  let redoStack = [];
  let lastSnapshot = '';

  function snapshot() { return JSON.stringify({title:titleInput.value, html:editor.innerHTML}); }
  function setStatus(text) { status.textContent = text; }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, snapshot()); setStatus('Saved locally'); }
    catch (e) { setStatus('Browser storage unavailable'); }
  }
  function scheduleSave() { setStatus('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveLocal, 250); updateMeta(); }
  function remember() {
    const current = snapshot();
    if (current !== lastSnapshot) { undoStack.push(lastSnapshot); if (undoStack.length > 100) undoStack.shift(); redoStack = []; lastSnapshot = current; }
  }
  function restoreSnapshot(value) {
    try { const data = JSON.parse(value); titleInput.value = data.title || 'Untitled document'; editor.innerHTML = data.html || '<p><br></p>'; lastSnapshot = snapshot(); rebuildIndex(); updateMeta(); saveLocal(); }
    catch(e) { /* Ignore invalid history entries. */ }
  }
  function cleanText(s) { return s.replace(/\s+/g, ' ').trim(); }
  function rebuildIndex() {
    const headings = [...editor.querySelectorAll('h2,h3')];
    indexList.innerHTML = '';
    if (!headings.length) { indexList.innerHTML = '<div class="index-empty">Add subtitles to create quick-jump links.</div>'; return; }
    headings.forEach((heading, i) => {
      if (!heading.id) heading.id = 'section-' + (i + 1);
      const label = cleanText(heading.innerText) || 'Untitled subtitle';
      const button = document.createElement('button');
      button.className = 'index-item'; button.textContent = label; button.title = label;
      if (heading.tagName === 'H3') button.style.paddingLeft = '22px';
      button.addEventListener('click', () => {
        heading.scrollIntoView({behavior:'smooth',block:'start'});
        editor.focus({preventScroll:true});
        indexList.querySelectorAll('.index-item').forEach(b => b.classList.remove('active'));
        button.classList.add('active');
      });
      indexList.appendChild(button);
    });
  }
  function updateMeta() {
    const text = editor.innerText || '';
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('wordCount').textContent = words + (words === 1 ? ' word' : ' words');
  }
  function exec(command, value = null) { editor.focus(); remember(); document.execCommand(command, false, value); remember(); rebuildIndex(); scheduleSave(); }
  function addSubtitle() {
    editor.focus(); remember();
    const selection = window.getSelection();
    let range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
    let block = range ? range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement : null;
    while (block && block !== editor && !/^(P|DIV|H2|H3|LI)$/.test(block.tagName)) block = block.parentElement;
    if (!block || block === editor) { block = document.createElement('p'); block.innerHTML = '<br>'; editor.appendChild(block); }
    const h = document.createElement('h2');
    h.textContent = cleanText(block.innerText) || 'New subtitle';
    block.replaceWith(h);
    const r = document.createRange(); r.selectNodeContents(h); r.collapse(false); selection.removeAllRanges(); selection.addRange(r);
    remember(); rebuildIndex(); scheduleSave();
  }
  document.getElementById('boldBtn').addEventListener('click', () => exec('bold'));
  document.getElementById('subtitleBtn').addEventListener('click', addSubtitle);
  document.getElementById('bodyBtn').addEventListener('click', () => { editor.focus(); remember(); document.execCommand('formatBlock',false,'P'); remember(); rebuildIndex(); scheduleSave(); });
  document.getElementById('undoBtn').addEventListener('click', () => { if (undoStack.length) { redoStack.push(snapshot()); restoreSnapshot(undoStack.pop()); } });
  document.getElementById('redoBtn').addEventListener('click', () => { if (redoStack.length) { undoStack.push(snapshot()); restoreSnapshot(redoStack.pop()); } });
  document.getElementById('addHeading').addEventListener('click', addSubtitle);
  editor.addEventListener('beforeinput', () => remember());
  editor.addEventListener('input', () => { remember(); rebuildIndex(); scheduleSave(); });
  titleInput.addEventListener('input', () => { remember(); scheduleSave(); });
  editor.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); exec('bold'); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveLocal(); exportDocument('html'); }
  });
  function download(name, type, content) {
    const blob = new Blob([content], {type}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function safeName() { return (titleInput.value.trim() || 'Untitled document').replace(/[\\/:*?"<>|]+/g,'-').slice(0,100); }
  function exportDocument(format) {
    saveLocal();
    if (format === 'txt') {
      const text = [...editor.childNodes].map(node => {
        if (node.nodeType === 3) return node.textContent;
        if (/^H[23]$/.test(node.nodeName)) return '\n' + node.innerText.toUpperCase() + '\n' + '='.repeat(Math.min(node.innerText.length,50));
        return node.innerText || '';
      }).join('\n\n').replace(/\n{3,}/g,'\n\n');
      download(safeName()+'.txt','text/plain;charset=utf-8',titleInput.value+'\n\n'+text);
    } else {
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHtml(titleInput.value)+'</title></head><body><h1>'+escapeHtml(titleInput.value)+'</h1>'+editor.innerHTML+'</body></html>';
      download(safeName()+'.html','text/html;charset=utf-8',html);
    }
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  document.getElementById('downloadBtn').addEventListener('click', () => exportDocument('txt'));
  document.getElementById('saveBtn').addEventListener('click', () => exportDocument('html'));
  window.addEventListener('beforeunload', saveLocal);
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { const data = JSON.parse(saved); titleInput.value = data.title || 'Untitled document'; editor.innerHTML = data.html || '<p><br></p>'; }
  } catch(e) { setStatus('Local saving unavailable'); }
  lastSnapshot = snapshot(); rebuildIndex(); updateMeta();
})();
</script>
</body>
</html>
